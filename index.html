<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Skeleton Player</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #111214; --card: #1c1d21; --line: #2c2e34; --text: #ececec; --muted: #9a9ca3;
    --accent: #ff8a1f; --on: #4cc76b; --off: #6b6d73; --danger: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 32px;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-size: 22px; margin: 4px 0 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.on { background: var(--on); } .dot.off { background: var(--off); }
  .muted { color: var(--muted); font-size: 14px; }
  button, .file {
    font: inherit; color: var(--text); background: #2a2c32; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; cursor: pointer;
  }
  button:disabled { opacity: .4; }
  .file input { display: none; }
  #startBtn {
    width: 100%; padding: 18px; font-size: 20px; font-weight: 600;
    background: var(--accent); color: #1a1000; border: 0;
  }
  #startBtn.stop { background: var(--danger); color: #fff; }
  #nowText { font-size: 18px; min-height: 2.8em; margin: 12px 0 4px; }
  .meter { height: 8px; background: #2a2c32; border-radius: 4px; overflow: hidden; margin-top: 10px; }
  #jawBar { height: 100%; width: 0; background: var(--accent); transition: width 40ms linear; }
  .pool { display: inline-flex; align-items: center; gap: 4px; }
  .poolBlock { border-top: 1px solid var(--line); padding: 8px 0; }
  .poolBlock:first-child { border-top: 0; padding-top: 0; }
  .poolHead { justify-content: space-between; }
  .linesBtn { padding: 6px 10px; font-size: 14px; }
  .lines { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .lines li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 4px 6px; border-radius: 10px; }
  .lines li.playing { background: #2a2c32; }
  .lines li.playing .playLine { background: var(--accent); color: #1a1000; border-color: transparent; }
  .playLine { width: 40px; height: 40px; padding: 0; flex: none; }
  .grid { display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; align-items: center; }
  .grid input[type=number] { width: 84px; }
  input[type=number] {
    font: inherit; color: var(--text); background: #2a2c32; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  #log { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); max-height: 180px; overflow: auto; margin: 0; }
  details summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>💀 Skeleton Player</h1>

  <section class="card">
    <h2>Nano</h2>
    <div class="row"><span id="nanoDot" class="dot off"></span><span id="nanoState">Not connected</span></div>
    <div class="row" style="margin-top:12px">
      <button id="usbBtn">Connect USB</button>
      <button id="serialBtn">Connect (Web Serial)</button>
    </div>
    <p id="noUsb" class="muted" hidden>This browser can't talk to USB devices. Use Chrome on Android.</p>
  </section>

  <section class="card">
    <h2>Clips</h2>
    <div class="row"><span id="packDot" class="dot off"></span><span id="packState">No pack loaded</span></div>
    <div id="pools" style="margin:12px 0 8px"></div>
    <label class="file" style="display:inline-block;margin-top:4px">Load skeleton.pack<input id="packFile" type="file"></label>
  </section>

  <section class="card">
    <button id="startBtn">Start</button>
    <div id="nowText">Stopped</div>
    <div class="row" style="justify-content:space-between">
      <span id="nowPool" class="muted"></span>
      <button id="nextBtn" disabled>Next now</button>
    </div>
    <div class="meter"><div id="jawBar"></div></div>
  </section>

  <section class="card">
    <h2>Settings</h2>
    <div class="grid">
      <label for="closed">Jaw closed angle</label>
      <div class="row"><input id="closed" type="number" min="0" max="180"><button data-test="closed">Test</button></div>
      <label for="open">Jaw open angle</label>
      <div class="row"><input id="open" type="number" min="0" max="180"><button data-test="open">Test</button></div>
      <label for="gap_min">Gap between lines, min (s)</label>
      <input id="gap_min" type="number" min="0" step="1">
      <label for="gap_max">Gap between lines, max (s)</label>
      <input id="gap_max" type="number" min="0" step="1">
    </div>
    <div style="margin-top:14px">
      <div class="row" style="justify-content:space-between"><label for="lead_ms">Jaw lead</label><span id="leadOut" class="muted"></span></div>
      <input id="lead_ms" type="range" min="-400" max="400" step="10">
      <p class="muted" style="margin:4px 0 0">Raise it if the jaw moves after the voice, lower it if the jaw moves first.</p>
    </div>
    <div style="margin-top:14px">
      <div class="row" style="justify-content:space-between"><label for="volume">Volume</label><span id="volumeOut" class="muted"></span></div>
      <input id="volume" type="range" min="0" max="1" step="0.05">
    </div>
  </section>

  <details class="card">
    <summary>Log</summary>
    <pre id="log"></pre>
  </details>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
